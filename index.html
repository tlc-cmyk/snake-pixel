<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pixel Dragon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0d0b14;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    color: #e8e0c8;
  }
  #wrap {
    border: 3px solid #c44a2a;
    box-shadow: 0 0 0 2px #4a1a10, 0 0 24px rgba(255, 100, 40, 0.35);
    line-height: 0;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 480px;
    height: 480px;
    background: #1a1430;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="240" height="240"></canvas></div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const GRID = 15;
  const CELLS = 16;
  const TICK_MS = 110;

  const COL = {
    bg: "#1a1430",
    grid: "#221a3c",
    body: "#e03a2f",
    bodyDark: "#9a1e18",
    bodyLight: "#ff6b4a",
    scale: "#ffd24a",
    mane: "#ff8c2a",
    horn: "#f5efd8",
    eye: "#0d0b14",
    eyeGlow: "#ffe566",
    tongue: "#ff4a7a",
    food: "#5dff9a",
    foodEdge: "#2a8a55",
    text: "#f5efd8",
    muted: "#a89cc0",
    title: "#ffd24a",
    danger: "#ff6b7a",
  };

  let state = "title";
  let snake, dir, nextDir, food, score, tickAcc, lastTs, grow;

  function reset() {
    const mid = Math.floor(CELLS / 2);
    snake = [
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
      { x: mid - 3, y: mid },
      { x: mid - 4, y: mid },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { ...dir };
    score = 0;
    grow = 0;
    placeFood();
  }

  function placeFood() {
    const taken = new Set(snake.map((s) => s.x + "," + s.y));
    let x, y;
    do {
      x = (Math.random() * CELLS) | 0;
      y = (Math.random() * CELLS) | 0;
    } while (taken.has(x + "," + y));
    food = { x, y };
  }

  function setDir(nx, ny) {
    if (state !== "play") return;
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  window.addEventListener("keydown", (e) => {
    const k = e.key;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter"].includes(k)) {
      e.preventDefault();
    }
    if (state === "title" && (k === " " || k === "Enter")) {
      reset();
      state = "play";
      return;
    }
    if (state === "over" && (k === " " || k === "Enter" || k === "r" || k === "R")) {
      reset();
      state = "play";
      return;
    }
    if (k === "ArrowUp" || k === "w" || k === "W") setDir(0, -1);
    else if (k === "ArrowDown" || k === "s" || k === "S") setDir(0, 1);
    else if (k === "ArrowLeft" || k === "a" || k === "A") setDir(-1, 0);
    else if (k === "ArrowRight" || k === "d" || k === "D") setDir(1, 0);
  });

  function step() {
    dir = nextDir;
    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= CELLS || ny >= CELLS) {
      state = "over";
      return;
    }
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === nx && snake[i].y === ny) {
        state = "over";
        return;
      }
    }

    snake.unshift({ x: nx, y: ny });
    if (nx === food.x && ny === food.y) {
      score += 10;
      grow += 1;
      placeFood();
    }
    if (grow > 0) grow--;
    else snake.pop();
  }

  function px(n) {
    return n * GRID;
  }

  function drawDragonHead(s) {
    const x = px(s.x);
    const y = px(s.y);
    // snout / head block
    ctx.fillStyle = COL.bodyLight;
    ctx.fillRect(x + 1, y + 2, 13, 11);
    ctx.fillStyle = COL.body;
    ctx.fillRect(x + 2, y + 3, 11, 9);

    // horns
    ctx.fillStyle = COL.horn;
    if (dir.x === 1) {
      ctx.fillRect(x + 4, y, 2, 3);
      ctx.fillRect(x + 9, y, 2, 3);
      ctx.fillRect(x + 3, y - 1, 2, 2);
      ctx.fillRect(x + 10, y - 1, 2, 2);
    } else if (dir.x === -1) {
      ctx.fillRect(x + 4, y, 2, 3);
      ctx.fillRect(x + 9, y, 2, 3);
      ctx.fillRect(x + 3, y - 1, 2, 2);
      ctx.fillRect(x + 10, y - 1, 2, 2);
    } else if (dir.y === -1) {
      ctx.fillRect(x, y + 3, 3, 2);
      ctx.fillRect(x, y + 8, 3, 2);
      ctx.fillRect(x - 1, y + 2, 2, 2);
      ctx.fillRect(x - 1, y + 9, 2, 2);
    } else {
      ctx.fillRect(x + 12, y + 3, 3, 2);
      ctx.fillRect(x + 12, y + 8, 3, 2);
      ctx.fillRect(x + 14, y + 2, 2, 2);
      ctx.fillRect(x + 14, y + 9, 2, 2);
    }

    // mane / whiskers
    ctx.fillStyle = COL.mane;
    if (dir.x === 1) {
      ctx.fillRect(x - 1, y + 4, 3, 2);
      ctx.fillRect(x - 1, y + 9, 3, 2);
      ctx.fillRect(x + 12, y + 6, 3, 2); // snout tip
    } else if (dir.x === -1) {
      ctx.fillRect(x + 13, y + 4, 3, 2);
      ctx.fillRect(x + 13, y + 9, 3, 2);
      ctx.fillRect(x, y + 6, 3, 2);
    } else if (dir.y === -1) {
      ctx.fillRect(x + 4, y + 13, 2, 3);
      ctx.fillRect(x + 9, y + 13, 2, 3);
      ctx.fillRect(x + 6, y, 2, 3);
    } else {
      ctx.fillRect(x + 4, y - 1, 2, 3);
      ctx.fillRect(x + 9, y - 1, 2, 3);
      ctx.fillRect(x + 6, y + 12, 2, 3);
    }

    // eyes
    ctx.fillStyle = COL.eyeGlow;
    if (dir.x !== 0) {
      const ox = dir.x > 0 ? 8 : 4;
      ctx.fillRect(x + ox, y + 4, 3, 3);
      ctx.fillRect(x + ox, y + 9, 3, 3);
      ctx.fillStyle = COL.eye;
      ctx.fillRect(x + ox + 1, y + 5, 2, 2);
      ctx.fillRect(x + ox + 1, y + 10, 2, 2);
    } else {
      const oy = dir.y > 0 ? 8 : 4;
      ctx.fillRect(x + 4, y + oy, 3, 3);
      ctx.fillRect(x + 9, y + oy, 3, 3);
      ctx.fillStyle = COL.eye;
      ctx.fillRect(x + 5, y + oy + 1, 2, 2);
      ctx.fillRect(x + 10, y + oy + 1, 2, 2);
    }

    // tongue
    ctx.fillStyle = COL.tongue;
    if (dir.x === 1) ctx.fillRect(x + 14, y + 7, 2, 1);
    else if (dir.x === -1) ctx.fillRect(x - 1, y + 7, 2, 1);
    else if (dir.y === -1) ctx.fillRect(x + 7, y - 1, 1, 2);
    else ctx.fillRect(x + 7, y + 14, 1, 2);
  }

  function drawBodySeg(s, i) {
    const x = px(s.x);
    const y = px(s.y);
    const isTail = i === snake.length - 1;
    if (isTail) {
      // pointed tail tip
      ctx.fillStyle = COL.scale;
      ctx.fillRect(x + 5, y + 5, 5, 5);
      ctx.fillStyle = COL.body;
      ctx.fillRect(x + 6, y + 6, 3, 3);
      ctx.fillStyle = COL.mane;
      ctx.fillRect(x + 7, y + 2, 1, 3);
      ctx.fillRect(x + 7, y + 10, 1, 3);
      ctx.fillRect(x + 2, y + 7, 3, 1);
      ctx.fillRect(x + 10, y + 7, 3, 1);
      return;
    }
    // scaly body — alternate gold ridge
    ctx.fillStyle = COL.bodyDark;
    ctx.fillRect(x + 1, y + 1, 13, 13);
    ctx.fillStyle = i % 2 === 0 ? COL.body : COL.bodyLight;
    ctx.fillRect(x + 2, y + 2, 11, 11);
    ctx.fillStyle = COL.scale;
    ctx.fillRect(x + 5, y + 3, 5, 2);
    ctx.fillRect(x + 6, y + 6, 3, 3);
    // small mane tufts on sides for longer look
    if (i % 3 === 1) {
      ctx.fillStyle = COL.mane;
      ctx.fillRect(x + 1, y + 6, 2, 2);
      ctx.fillRect(x + 12, y + 6, 2, 2);
    }
  }

  function drawDragon() {
    for (let i = snake.length - 1; i >= 0; i--) {
      if (i === 0) drawDragonHead(snake[i]);
      else drawBodySeg(snake[i], i);
    }
  }

  function drawFood() {
    const x = px(food.x);
    const y = px(food.y);
    // pearl / orb for the dragon
    ctx.fillStyle = COL.foodEdge;
    ctx.fillRect(x + 3, y + 3, 9, 9);
    ctx.fillStyle = COL.food;
    ctx.fillRect(x + 4, y + 4, 7, 7);
    ctx.fillStyle = "#e8ffe8";
    ctx.fillRect(x + 5, y + 5, 2, 2);
  }

  function drawBg() {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = COL.grid;
    for (let i = 0; i <= CELLS; i++) {
      ctx.fillRect(i * GRID, 0, 1, canvas.height);
      ctx.fillRect(0, i * GRID, canvas.width, 1);
    }
  }

  function drawScore() {
    ctx.fillStyle = COL.text;
    ctx.font = "10px monospace";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + score, 6, 12);
  }

  function drawCenterText(lines, titleColor) {
    ctx.textAlign = "center";
    let y = 88;
    lines.forEach((line, i) => {
      if (i === 0) {
        ctx.fillStyle = titleColor || COL.title;
        ctx.font = "bold 18px monospace";
      } else {
        ctx.fillStyle = COL.muted;
        ctx.font = "10px monospace";
      }
      ctx.fillText(line, canvas.width / 2, y);
      y += i === 0 ? 22 : 14;
    });
  }

  function drawTitlePreview() {
    const preview = [
      { x: 6, y: 12 },
      { x: 5, y: 12 },
      { x: 4, y: 12 },
      { x: 3, y: 12 },
      { x: 2, y: 12 },
    ];
    const saved = snake;
    const savedDir = dir;
    snake = preview;
    dir = { x: 1, y: 0 };
    drawDragon();
    snake = saved;
    dir = savedDir;
    // pearl
    const fx = px(9);
    const fy = px(12);
    ctx.fillStyle = COL.foodEdge;
    ctx.fillRect(fx + 3, fy + 3, 9, 9);
    ctx.fillStyle = COL.food;
    ctx.fillRect(fx + 4, fy + 4, 7, 7);
  }

  function draw() {
    drawBg();
    if (state === "title") {
      drawTitlePreview();
      drawCenterText([
        "PIXEL DRAGON",
        "Arrow keys to steer the dragon",
        "Eat pearls · grow · avoid walls & self",
        "PRESS SPACE TO START",
      ]);
      return;
    }

    drawFood();
    drawDragon();
    drawScore();

    if (state === "over") {
      ctx.fillStyle = "rgba(13, 11, 20, 0.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawCenterText(
        ["GAME OVER", "Score " + score, "SPACE / ENTER / R to retry"],
        COL.danger
      );
    }
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    lastTs = ts;
    if (state === "play") {
      tickAcc = (tickAcc || 0) + dt;
      while (tickAcc >= TICK_MS) {
        tickAcc -= TICK_MS;
        if (state === "play") step();
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
